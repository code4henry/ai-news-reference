# AI 技术资讯来源配置
# 时区：默认 Asia/Hong_Kong，可用环境变量 AI_NEWS_TZ 覆盖

timezone: "Asia/Hong_Kong"

news_sources:
  # ---- 英文主流 AI 资讯 ----
  - name: "AI News"
    url: "https://artificialintelligence-news.com/feed/"
    type: "rss"
    category: "general"
    language: "en"
  - name: "MIT Technology Review AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
    type: "rss"
    category: "research"
    language: "en"

  # ---- 中文科技媒体 ----
  - name: "36氪"
    url: "https://36kr.com/feed"
    type: "rss"
    category: "tech"
    language: "zh"
  - name: "雷锋网"
    url: "https://www.leiphone.com/feed"
    type: "rss"
    category: "tech"
    language: "zh"

  # ---- 美股大厂官方博客 ----
  - name: "NVIDIA Blog"
    url: "https://blogs.nvidia.com/feed/"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Microsoft AI Blog"
    url: "https://blogs.microsoft.com/ai/feed/"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Amazon Science"
    url: "https://www.amazon.science/index.rss"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Apple ML Research"
    url: "https://machinelearning.apple.com/rss.xml"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Meta Newsroom"
    url: "https://about.fb.com/feed/"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Google Research Blog"
    url: "https://research.google/blog/rss/"
    type: "rss"
    category: "research"
    language: "en"

  # ---- 社区 & 平台 ----
  - name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"
    type: "rss"
    category: "research"
    language: "en"
  - name: "TechCrunch AI"
    url: "https://techcrunch.com/tag/artificial-intelligence/feed/"
    type: "rss"
    category: "industry"
    language: "en"
  - name: "Reddit r/MachineLearning"
    url: "https://www.reddit.com/r/MachineLearning/hot/.rss"
    type: "rss"
    category: "community"
    language: "en"
  - name: "Reddit r/LocalLLaMA"
    url: "https://www.reddit.com/r/LocalLLaMA/hot/.rss"
    type: "rss"
    category: "community"
    language: "en"

# LLM 排行榜配置
llm_rankings:
  - name: "LMSYS Chatbot Arena"
    slug: "lmsys_arena"
    url: "https://lmarena.ai/api/leaderboard"
    type: "json"
    category: "arena"
  - name: "Hugging Face Open LLM Leaderboard"
    slug: "hf_open_llm"
    url: "https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard"
    type: "json"
    category: "benchmark"
  - name: "Papers With Code SOTA"
    slug: "paperswithcode_sota"
    url: "https://paperswithcode.com/api/v1/sota-papers/"
    type: "json"
    category: "benchmark"

# 通知配置
notification:
  enabled: true
  method: "qq"
  qq:
    endpoint: "http://127.0.0.1:5700"
    access_token: ""
    group_id: ""
    user_id: ""
    bot_id: ""
    timeout: 10

# 数据存储配置
storage:
  base_dir: "./data"
  format: "markdown"
  max_days: 30
  backup_enabled: true
  backup_dir: "./backup"

# 并发配置（aiohttp 抓取全文时使用）
fetch:
  full_text_concurrency: 10
  full_text_per_request_timeout: 10
  full_text_max_chars: 2000
