# AI 技术资讯来源配置
# 时区：默认 Asia/Hong_Kong，可用环境变量 AI_NEWS_TZ 覆盖

timezone: "Asia/Hong_Kong"

news_sources:
  - name: "AI News"
    url: "https://artificialintelligence-news.com/feed/"
    type: "rss"
    category: "general"
    language: "en"
  - name: "MIT Technology Review AI"
    url: "https://www.technologyreview.com/topic/artificial-intelligence/feed/"
    type: "rss"
    category: "research"
    language: "en"
  - name: "Towards Data Science"
    url: "https://towardsdatascience.com/feed"
    type: "rss"
    category: "data-science"
    language: "en"
  - name: "AI Alignment Forum"
    url: "https://www.alignmentforum.org/rss.xml"
    type: "rss"
    category: "alignment"
    language: "en"
  - name: "DeepLearning.AI The Batch"
    url: "https://www.deeplearning.ai/the-batch/feed/"
    type: "rss"
    category: "education"
    language: "en"
  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    type: "rss"
    category: "research"
    language: "en"

# LLM 排行榜配置
# 修复：原 LMSYS URL (chat.lmsys.org/api/leaderboard) 已下线；改为 lmarena.ai
llm_rankings:
  - name: "LMSYS Chatbot Arena"
    slug: "lmsys_arena"
    url: "https://lmarena.ai/api/leaderboard"
    type: "json"
    category: "arena"
  - name: "Hugging Face Open LLM Leaderboard"
    slug: "hf_open_llm"
    url: "https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard"
    type: "json"
    category: "benchmark"
  - name: "Papers With Code SOTA"
    slug: "paperswithcode_sota"
    url: "https://paperswithcode.com/api/v1/sota-papers/"
    type: "json"
    category: "benchmark"

# 通知配置
# 通过 QQ bot（go-cqhttp / OneBot v11）推送
# 必填：endpoint, group_id 或 user_id 二选一
# 可通过环境变量覆盖：QQ_BOT_HTTP_API / QQ_BOT_TOKEN / QQ_GROUP_ID / QQ_USER_ID
notification:
  enabled: true
  method: "qq"
  qq:
    endpoint: "http://127.0.0.1:5700"   # go-cqhttp / napcat 默认监听地址
    access_token: ""                       # 若 bot 端设置了 access_token，在这里填
    group_id: ""                           # 推送到群（私聊留空）
    user_id: ""                            # 推送到个人（群聊留空即可）
    bot_id: ""                             # 可选，调试用
    timeout: 10

# 数据存储配置
storage:
  base_dir: "./data"
  format: "markdown"
  max_days: 30
  backup_enabled: true
  backup_dir: "./backup"

# 并发配置（aiohttp 抓取全文时使用）
fetch:
  full_text_concurrency: 10
  full_text_per_request_timeout: 10
  full_text_max_chars: 2000
